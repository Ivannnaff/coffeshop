; Queue worker Menanti.
; Simpan sebagai /etc/supervisor/conf.d/menanti-queue.conf lalu:
;   sudo supervisorctl reread && sudo supervisorctl update
;
; Sesuaikan path proyek dan user.

[program:menanti-queue]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/menanti/artisan queue:work --sleep=1 --tries=3 --timeout=90
directory=/var/www/menanti
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/log/menanti-queue.log
stopwaitsecs=3600

; Opsional: jalankan Reverb jika BROADCAST_CONNECTION=reverb.
; Nginx harus mem-proxy port 8080 ke Reverb.
;
; [program:menanti-reverb]
; process_name=%(program_name)s_%(process_num)02d
; command=php /var/www/menanti/artisan reverb:start --host=127.0.0.1 --port=8080
; directory=/var/www/menanti
; autostart=true
; autorestart=true
; user=www-data
; numprocs=1
; redirect_stderr=true
; stdout_logfile=/var/log/menanti-reverb.log
